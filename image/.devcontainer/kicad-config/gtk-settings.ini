# Installed as /etc/xdg/gtk-3.0/settings.ini by the sandbox image.
#
# GTK applications draw their own title bar and ask GNOME which buttons to
# put in it. That setting does not exist in a container, so the default is
# "close" alone. This gives every GTK window in every container the buttons
# the host has.
[Settings]
gtk-decoration-layout=appmenu:minimize,maximize,close
